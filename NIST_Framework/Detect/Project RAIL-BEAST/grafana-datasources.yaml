apiVersion: 1

datasources:

  # ---------------------------------------------------------
  # Loki (Host) - Snort + Syslog + Authlog
  # ---------------------------------------------------------
  - name: Loki-Host
    type: loki
    access: proxy
    url: http://loki-host:3100
    jsonData:
      maxLines: 1000
    editable: true

  # ---------------------------------------------------------
  # Loki (Train-Net) - DVWA + Cowrie + Nginx
  # ---------------------------------------------------------
  - name: Loki-TrainNet
    type: loki
    access: proxy
    url: http://loki-trainnet:3100
    jsonData:
      maxLines: 1000
    editable: true

  # ---------------------------------------------------------
  # Prometheus - Metrics (cAdvisor + Alloy + Prometheus)
  # ---------------------------------------------------------
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
