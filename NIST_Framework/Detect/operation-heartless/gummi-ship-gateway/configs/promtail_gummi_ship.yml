server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions_gummi_ship.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: gummi-ship-zeek-conn
    static_configs:
      - targets:
          - localhost
        labels:
          job: operation-heartless
          realm: gummi-ship-gateway
          sensor: zeek-conn
          __path__: /home/brandongregg/Portfolios/operation-heartless/gummi-ship-gateway/logs/conn.log

  - job_name: gummi-ship-zeek-dns
    static_configs:
      - targets:
          - localhost
        labels:
          job: operation-heartless
          realm: gummi-ship-gateway
          sensor: zeek-dns
          __path__: /home/brandongregg/Portfolios/operation-heartless/gummi-ship-gateway/logs/dns.log
